[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-ledger"
version = "1.0.0"
description = "Cryptographic Action Attestation & Merkle Audit Trail for Autonomous AI Agents"
authors = [
    { name = "Abenezer (Susan)", email = "contact@satiralabs.com" }
]
readme = "README.md"
requires-python = ">=3.8"
keywords = ["ai-safety", "agent-governance", "cryptography", "audit-trail", "merkle-tree", "llm-security"]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Security :: Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
]

[project.scripts]
agent-ledger = "agent_ledger.cli:main"
